.brand .an{font-family:var(--geo);font-size:16px;font-weight:600;letter-spacing:.01em;color:var(--ink-950);line-height:1.15}
.brand .fm{font-family:var(--geo);font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-400);margin-top:3px}
.nsec{display:flex;align-items:center;font-family:var(--geo);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--ink-400);padding:14px 18px 5px}
.nav{padding:2px 10px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--ink-700);font-size:13.5px;font-weight:500;user-select:none}
.navitem:hover{background:var(--ink-50)}
.navitem.sel{background:var(--ink-100);color:var(--ink-950);font-weight:600}
.navitem svg{width:16px;height:16px;color:var(--ink-400)}
.navitem.sel svg{color:var(--ink-600)}
.navitem .nt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .cnt{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-400);font-weight:500}
.navitem .wdot{width:7px;height:7px;border-radius:99px;background:var(--brick)}
.spacer{flex:1}
.user{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--ink-100)}
.user .av{width:32px;height:32px;border-radius:99px;background:var(--grafito);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.user .un{font-size:12.5px;font-weight:600}
.user .ur{font-family:var(--geo);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400)}
/* CONTENT */
.main{grid-column:2;grid-row:1;overflow:auto;padding:26px 30px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.eyebrow{font-family:var(--geo);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--ink-400)}
.ptitle{font-family:var(--geo);text-transform:uppercase;font-size:22px;font-weight:600;letter-spacing:.13em;color:var(--ink-950);margin-top:5px}
.ul{height:2px;width:28px;background:var(--ocre);border-radius:2px;margin-top:9px}
.psub{margin-top:9px;color:var(--ink-500);font-size:13.5px}
.pr{display:flex;align-items:center;gap:10px}
.btns{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink-200);background:#fff;border-radius:9px;padding:10px 14px;font-size:13px;color:var(--ink-600);cursor:pointer;font-family:var(--sans)}
.btns:hover{background:var(--ink-50);border-color:var(--ink-300)}
.btns svg{width:15px;height:15px}
.btnp{display:inline-flex;align-items:center;gap:8px;background:var(--ink-600);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-family:var(--geo);font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer}
.btnp:hover{background:var(--ink-700)}.btnp svg{width:15px;height:15px}
.searchbar{display:none;margin-bottom:16px}
.searchbar.on{display:block}
.searchbar .sw{position:relative;max-width:420px}
.searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-400)}
.searchbar input{width:100%;padding:11px 12px 11px 35px;border:1px solid var(--ink-200);border-radius:10px;background:#fff;font-size:13.5px;color:var(--ink-800);outline:none;font-family:var(--sans)}
.searchbar input:focus{box-shadow:0 0 0 2px var(--ink-200);border-color:var(--ink-300)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--ink-200);border-radius:12px;padding:15px 16px;box-shadow:var(--sombra)}
.kpi .kh{display:flex;align-items:flex-start;justify-content:space-between}
.kpi .kl{font-family:var(--geo);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--ink-400)}
.kpi .ki{width:16px;height:16px;color:var(--ink-300)}
.kpi .kv{font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;color:var(--ink-950);letter-spacing:-.01em;margin-top:10px;line-height:1}
.kpi .ks{margin-top:9px;font-size:12px;color:var(--ink-500)}
/* PANEL + TABLE */
.panel{background:#fff;border:1px solid var(--ink-200);border-radius:14px;box-shadow:var(--sombra);overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--ink-100)}
.panel-h .pt{display:flex;align-items:center;gap:9px;font-family:var(--geo);text-transform:uppercase;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--ink-800)}
.panel-h .pt svg{width:15px;height:15px;color:var(--ink-400)}
.panel-h .pa{font-family:var(--geo);text-transform:uppercase;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--ink-400);display:inline-flex;gap:7px;align-items:center}
.panel-h .pa svg{width:14px;height:14px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-family:var(--geo);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--ink-400);padding:11px 18px;border-bottom:1px solid var(--ink-100)}
thead th.r{text-align:right}
tbody td{padding:14px 18px;border-bottom:1px solid var(--ink-100);font-size:13.5px;color:var(--ink-700);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--ink-50)}
.hora{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-500)}
.hora b{color:var(--ink-950);font-weight:600}
.cli .cn{display:block;color:var(--ink-950);font-weight:600;font-size:13.5px}
.cli .ca{color:var(--ink-500);font-size:12.5px;margin-top:2px}
.tel{font-variant-numeric:tabular-nums;color:var(--ink-600);white-space:nowrap}
.td-r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.pill .pd{width:6px;height:6px;border-radius:99px}
.pill.ok{color:#3f6b4c;background:#F3F8F4;border-color:#d7e6db}.pill.ok .pd{background:var(--sage)}
.pill.pend{color:var(--ink-600);background:var(--ink-100);border-color:var(--ink-200)}.pill.pend .pd{background:var(--ink-400)}
.pill.no{color:#8f322b;background:#FBF1F0;border-color:#efd8d5}.pill.no .pd{background:var(--brick)}
.rem{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink-200);border-radius:8px;background:#fff;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--ink-600);cursor:pointer;font-family:var(--sans)}
.rem:hover{background:var(--ink-50);border-color:var(--ink-300)}
.rem svg{width:14px;height:14px}
.rem.done{color:var(--sage);border-color:#cfe0d4;background:#F3F8F4;cursor:default}
.empty{padding:48px;text-align:center;color:var(--ink-500);font-size:13.5px}
.empty b{color:var(--ink-800)}
/* FOOT */

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(11,13,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:var(--pop);width:min(540px,100%);max-height:92vh;overflow:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--ink-100)}
.modal-h .mt{font-family:var(--geo);text-transform:uppercase;font-size:14px;font-weight:600;letter-spacing:.08em;color:var(--ink-950)}
.iconx{width:30px;height:30px;border:1px solid var(--ink-200);background:#fff;border-radius:8px;color:var(--ink-500);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconx:hover{background:var(--ink-50)}.iconx svg{width:15px;height:15px}
.modal-b{padding:18px 20px;display:grid;gap:14px}
.field label{display:block;font-family:var(--geo);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--ink-400);margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--ink-200);border-radius:9px;font-size:14px;color:var(--ink-900);background:#fff;outline:none;font-family:var(--sans)}
.field input:focus,.field select:focus{box-shadow:0 0 0 2px var(--ink-200);border-color:var(--ink-300)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-600);cursor:pointer;user-select:none}
.check input{width:15px;height:15px;accent-color:var(--ink-600)}
.ferr{color:var(--brick);font-size:12px;min-height:0}
.modal-f{display:flex;align-items:center;gap:10px;padding:16px 20px;border-top:1px solid var(--ink-100)}
.modal-f .sp{flex:1}
.btn-ghost{border:1px solid var(--ink-200);background:#fff;border-radius:9px;padding:10px 16px;font-size:13px;color:var(--ink-600);cursor:pointer;font-family:var(--sans)}
.btn-ghost:hover{background:var(--ink-50)}
.btn-danger{border:1px solid #efd8d5;background:#FBF1F0;color:var(--brick);border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;font-family:var(--sans)}
.btn-danger:hover{background:#f7e6e4}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink-950);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--pop);opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:9px;z-index:80}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:#8fce9f}
@media(max-width:920px){.kpis{grid-template-columns:1fr 1fr}.app{grid-template-columns:220px 1fr}}
</style>

<div class="app">
  <aside class="sidebar">

  <main class="main">
    <div class="phead">
      <div><div class="eyebrow">Herramientas internas</div><div class="ptitle">Citas</div><div class="ul"></div><div class="psub" id="psub"></div></div>
      <div class="pr">
        <button class="btns" id="btnBuscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Buscar</button>
        <button class="btnp" id="btnNueva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nueva cita</button>
      </div>
    </div>
    <div class="searchbar" id="searchbar"><div class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Buscar por cliente o asunto…" autocomplete="off"></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="panel">
      <div class="panel-h"><div class="pt" id="panelTitle"></div><div class="pa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span id="panelCount"></span></div></div>

    <div class="modal-h"><div class="mt" id="modalTitle">Nueva cita</div><button class="iconx" id="modalClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-b">
      <div class="field"><label>Cliente</label><input id="fCliente" placeholder="Nombre del cliente"></div>
      <div class="field"><label>Asunto</label><input id="fAsunto" placeholder="Materia de la consulta"></div>

      <button class="btn-ghost" id="btnCancelar">Cancelar</button>
      <button class="btnp" id="btnGuardar">Guardar</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const PK="artigas.citas.v1";

/* ---- Iconos (lucide-style) ---- */
const IC={
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',

};

/* ---- Utilidades de fecha (portadas del original) ---- */
const WD=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MOS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const two=n=>(n<10?'0'+n:''+n);
const DESPACHO_TXT='C/ Esperanto, 5, 7º-B de Benidorm.';
const DEFAULT_MAPS='https://maps.app.goo.gl/fES91xJhujFg9wdi8';
function fmtFecha(dt){return `${WD[dt.getDay()]} ${dt.getDate()} de ${MO[dt.getMonth()]} de ${dt.getFullYear()}`;}
function fmtHora(dt){return `${two(dt.getHours())}:${two(dt.getMinutes())} horas`;}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dtOf(c){const[y,m,d]=c.fecha.split('-').map(Number);const[hh,mm]=c.hora.split(':').map(Number);return new Date(y,m-1,d,hh,mm,0,0);}
function dayOf(c){const[y,m,d]=c.fecha.split('-').map(Number);return new Date(y,m-1,d);}
function ymd(d){return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

/* ---- Mensaje de recordatorio (lógica del original) ---- */
function msgRecordatorio(c){
  const dt=dtOf(c);
  const now=new Date();
  const tomorrow=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const esManana=sameDay(dt,tomorrow);
  const cuando=esManana?`mañana a las ${fmtHora(dt)}`:`el ${fmtFecha(dt)} a las ${fmtHora(dt)}`;
  return [
    'Estimado/a cliente:','',
    `Le recordamos su cita con Adolfo Artigas para ${cuando}, en nuestro despacho ubicado en ${DESPACHO_TXT}`,'',
    DEFAULT_MAPS,'',
    'En caso de que no pudiera asistir, le agradeceríamos que nos lo comunicara respondiendo a este mismo WhatsApp, con el fin de reorganizar la agenda y poder fijar una nueva cita.','',
    'Reciba un cordial saludo.'
  ].join('\n');
}

/* ---- Estado / persistencia ---- */
function seed(){
  const base=startOfDay(new Date());
  const mk=(off,hora)=>{const d=new Date(base);d.setDate(d.getDate()+off);return ymd(d);};
  const todayStr=ymd(base);
  const rows=[
    ['Rosa M. Belmonte','Divorcio — primera visita',0,'12:30','626 830 084','confirmada',true,true],
    ['C. P. Edif. Mirador','Junta — reclamación de cuotas',0,'17:00','','sinconfirmar',false,false],
    ['Grupo Salinas S.L.','Vicios ocultos en nave',1,'10:00','965 000 000','confirmada',false,true],
    ['Herederos de J. Ferri','Extinción de condominio',2,'09:30','','pendiente',false,false],
    ['Familia Ortuño','Herencia — cuaderno particional',2,'12:30','600 112 233','confirmada',true,true],
    ['Inmobiliaria Costa Blanca','Revisión de arrendamiento',2,'16:00','965 445 566','sinconfirmar',false,false],
    ['D. Navarro Piera','Reclamación de cantidad',3,'09:30','622 778 899','sinconfirmar',true,false],
    ['Administraciones Benicasa','Impugnación de acuerdo',3,'16:00','912 345 678','confirmada',false,true],
    ['C. P. Los Álamos','Defecto constructivo — LOE',5,'11:00','965 220 011','pendiente',false,false],
    ['Talleres Bernabeu S.L.','Contrato mercantil',6,'10:30','965 330 022','confirmada',true,true],
    ['Marta Sellés','Consulta de divorcio',-4,'10:00','631 090 090','confirmada',false,true],
    ['Comunidad Playa Sol','Firma de acuerdo',-7,'12:00','','confirmada',false,true]
  ];
  return rows.map((r,i)=>({
    id:'c'+i+'_'+Math.random().toString(36).slice(2,7),
    cliente:r[0],asunto:r[1],fecha:mk(r[2]),hora:r[3],telefono:r[4],estado:r[5],
    primera:r[6],recordada:r[7],recordadaAt:r[7]?(r[2]>=0?todayStr:mk(r[2])):null
  }));
}
function load(){try{const raw=localStorage.getItem(PK);if(raw)return JSON.parse(raw);}catch(e){}const s=seed();try{localStorage.setItem(PK,JSON.stringify(s));}catch(e){}return s;}
let CITAS=load();
function save(){try{localStorage.setItem(PK,JSON.stringify(CITAS));}catch(e){}}

/* ---- Filtros ---- */
let FILTER='proximas';
let QUERY='';
const TODAY=()=>startOfDay(new Date());
function inWeek(c){const t=TODAY();const end=new Date(t);end.setDate(end.getDate()+7);const d=dayOf(c);return d>=t&&d<end;}
function isFuture(c){return dayOf(c)>=TODAY();}
function isToday(c){return sameDay(dayOf(c),TODAY());}
function recordedToday(c){return c.recordada&&c.recordadaAt&&sameDay(new Date(c.recordadaAt+'T00:00'),TODAY());}

const FILTERS={
  proximas:{label:'Próximas citas',test:isFuture,sort:(a,b)=>dtOf(a)-dtOf(b)},
  hoy:{label:'Citas de hoy',test:isToday,sort:(a,b)=>dtOf(a)-dtOf(b)},
  semana:{label:'Citas de esta semana',test:inWeek,sort:(a,b)=>dtOf(a)-dtOf(b)},
  historial:{label:'Historial de citas',test:c=>dayOf(c)<TODAY(),sort:(a,b)=>dtOf(b)-dtOf(a)},
  sinconfirmar:{label:'Citas sin confirmar',test:c=>c.estado==='sinconfirmar'&&isFuture(c),sort:(a,b)=>dtOf(a)-dtOf(b)},
  recordatorios:{label:'Recordatorios enviados',test:c=>!!c.recordada,sort:(a,b)=>(b.recordadaAt||'').localeCompare(a.recordadaAt||'')}
};
function listFor(key){
  const f=FILTERS[key];
  let arr=CITAS.filter(f.test);
  if(QUERY){const q=QUERY.toLowerCase();arr=arr.filter(c=>(c.cliente+' '+c.asunto).toLowerCase().includes(q));}
  return arr.sort(f.sort);
}

/* ---- Etiquetas de estado ---- */
const ESTADOS={confirmada:['ok','Confirmada'],pendiente:['pend','Pendiente'],sinconfirmar:['no','Sin confirmar']};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function horaLabel(c){
  const d=dayOf(c),t=TODAY();
  const tom=new Date(t);tom.setDate(tom.getDate()+1);
  let day;
  if(sameDay(d,t))day='Hoy';
  else if(sameDay(d,tom))day='Mañana';
  else day=`${d.getDate()} ${MOS[d.getMonth()]}`;
  return `${day} · <b>${c.hora}</b>`;
}

/* ---- KPIs ---- */
function proximaTxt(){
  const now=new Date();
  const up=CITAS.filter(c=>dtOf(c)>=now).sort((a,b)=>dtOf(a)-dtOf(b));
  if(!up.length)return 'sin próximas citas';
  const n=up[0];
  if(!sameDay(dtOf(n),TODAY()))return 'nada más por hoy';
  const mins=Math.round((dtOf(n)-now)/60000);
  const rel=mins<1?'ahora':mins<60?`en ${mins} min`:`en ${Math.round(mins/60)} h`;
  return `próxima ${rel} · ${n.hora}`;
}
function renderKPIs(){
  const hoy=CITAS.filter(isToday).length;
  const semana=CITAS.filter(inWeek).length;
  const sinc=CITAS.filter(c=>c.estado==='sinconfirmar'&&isFuture(c)).length;
  const primeras=CITAS.filter(c=>inWeek(c)&&c.primera).length;
  const rec=CITAS.filter(recordedToday).length;
  const cards=[
    ['Citas hoy',hoy,proximaTxt(),IC.cal],
    ['Esta semana',semana,primeras===0?'sin primeras visitas':(primeras+(primeras===1?' primera visita':' primeras visitas')),IC.clock],
    ['Sin confirmar',sinc,sinc===0?'todo confirmado':'requieren recordatorio',IC.bell],
    ['Recordados hoy',rec,'por email · WhatsApp',IC.check]
  ];
  $('kpis').innerHTML=cards.map(c=>`<div class="kpi"><div class="kh"><div class="kl">${c[0]}</div><div class="ki">${c[3]}</div></div><div class="kv">${c[1]}</div><div class="ks">${esc(c[2])}</div></div>`).join('');
}

/* ---- Navegación lateral ---- */
function renderNav(){
  const agenda=[
    ['proximas','Próximas',IC.clock,CITAS.filter(isFuture).length],
    ['hoy','Hoy',IC.cal,CITAS.filter(isToday).length],
    ['semana','Esta semana',IC.caldays,CITAS.filter(inWeek).length],
    ['historial','Historial',IC.hist,null]
  ];
  const sinc=CITAS.filter(c=>c.estado==='sinconfirmar'&&isFuture(c)).length;
  const avisos=[
    ['sinconfirmar','Sin confirmar',IC.bell,null,sinc>0],
    ['recordatorios','Recordatorios',IC.mail,CITAS.filter(c=>!!c.recordada).length,false]
  ];
  const item=(k,label,icon,cnt,dot)=>`<div class="navitem${FILTER===k?' sel':''}" data-f="${k}">${icon}<span class="nt">${label}</span>${dot?'<span class="wdot"></span>':''}${cnt!=null?`<span class="cnt">${cnt}</span>`:''}</div>`;
  $('navAgenda').innerHTML=agenda.map(a=>item(a[0],a[1],a[2],a[3],false)).join('');
  $('navAvisos').innerHTML=avisos.map(a=>item(a[0],a[1],a[2],a[3],a[4])).join('');
  document.querySelectorAll('.navitem').forEach(el=>el.onclick=()=>{FILTER=el.dataset.f;render();});
}

/* ---- Tabla ---- */
function renderTable(){
  const list=listFor(FILTER);
  $('panelTitle').innerHTML=`${IC.clock}<span>${FILTERS[FILTER].label}</span>`;
  $('panelCount').textContent=list.length+(list.length===1?' cita':' citas');
  if(!list.length){
    $('tableWrap').innerHTML=`<div class="empty">No hay citas en <b>${esc(FILTERS[FILTER].label.toLowerCase())}</b>.${QUERY?' Prueba con otra búsqueda.':''}</div>`;
    return;
  }
  const rows=list.map(c=>{
    const[cls,txt]=ESTADOS[c.estado];
    const tel=c.telefono?esc(c.telefono):'<span style="color:var(--ink-300)">—</span>';
    const rem=c.recordada
      ?`<button class="rem done" data-done="1">${IC.check}Recordado</button>`
      :`<button class="rem" data-rem="${c.id}">${IC.bell}Recordar</button>`;
    return `<tr data-edit="${c.id}">
      <td class="hora">${horaLabel(c)}</td>
      <td class="cli"><span class="cn">${esc(c.cliente)}</span><span class="ca">${esc(c.asunto)}</span></td>
      <td class="tel">${tel}</td>
      <td><span class="pill ${cls}"><span class="pd"></span>${txt}</span></td>
      <td class="td-r">${rem}</td>
    </tr>`;
  }).join('');
  $('tableWrap').innerHTML=`<table><thead><tr><th>Hora</th><th>Cliente</th><th>Teléfono</th><th>Estado</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=e=>{e.stopPropagation();recordar(b.dataset.rem);});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=e=>e.stopPropagation());
  document.querySelectorAll('[data-edit]').forEach(tr=>tr.onclick=()=>openModal(tr.dataset.edit));
}

function render(){renderNav();renderKPIs();renderTable();updateSub();}
function updateSub(){
  const d=new Date();
  $('psub').textContent=`Agenda de visitas y recordatorios del despacho · ${WD[d.getDay()]}, ${d.getDate()} de ${MO[d.getMonth()]} de ${d.getFullYear()}.`;
}

/* ---- Recordar ---- */
function recordar(id){
  const c=CITAS.find(x=>x.id===id);if(!c)return;
  c.recordada=true;c.recordadaAt=ymd(new Date());
  save();
  const msg=msgRecordatorio(c);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).catch(()=>{});}
  toast(`Recordado ✓ · mensaje para ${c.cliente.split(' ')[0]} copiado`);
  render();
}

/* ---- Toast ---- */
let toastT;
function toast(txt){
  const el=$('toast');
  el.innerHTML=IC.check+'<span>'+esc(txt)+'</span>';
  el.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('on'),2600);
}

/* ---- Modal ---- */
let editing=null;
function openModal(id){
  editing=id||null;
  const c=id?CITAS.find(x=>x.id===id):null;
  $('modalTitle').textContent=c?'Editar cita':'Nueva cita';
  $('fErr').textContent='';
  $('fCliente').value=c?c.cliente:'';
  $('fAsunto').value=c?c.asunto:'';
  $('fFecha').value=c?c.fecha:ymd(new Date());
  $('fHora').value=c?c.hora:'10:00';
  $('fTel').value=c?c.telefono:'';
  $('fEstado').value=c?c.estado:'confirmada';
  $('fPrimera').checked=c?!!c.primera:false;
  $('btnBorrar').style.display=c?'block':'none';
  $('overlay').classList.add('on');
  setTimeout(()=>$('fCliente').focus(),40);
}
function closeModal(){$('overlay').classList.remove('on');editing=null;}
function guardar(){
  const cliente=$('fCliente').value.trim();
  const fecha=$('fFecha').value;
  const hora=$('fHora').value;
  if(!cliente){$('fErr').textContent='Indica el nombre del cliente.';return;}
  if(!fecha||!hora){$('fErr').textContent='Indica fecha y hora de la cita.';return;}
  const data={cliente,asunto:$('fAsunto').value.trim()||'Consulta',fecha,hora,telefono:$('fTel').value.trim(),estado:$('fEstado').value,primera:$('fPrimera').checked};
  if(editing){const c=CITAS.find(x=>x.id===editing);Object.assign(c,data);toast('Cita actualizada');}
  else{CITAS.push(Object.assign({id:'c_'+Math.random().toString(36).slice(2,9),recordada:false,recordadaAt:null},data));toast('Cita creada');}
  save();closeModal();render();
}
function borrar(){
  if(!editing)return;
  CITAS=CITAS.filter(x=>x.id!==editing);
  save();closeModal();render();toast('Cita eliminada');
}

/* ---- Eventos ---- */
$('btnNueva').onclick=()=>openModal(null);
$('btnGuardar').onclick=guardar;
$('btnCancelar').onclick=closeModal;
$('modalClose').onclick=closeModal;
$('btnBorrar').onclick=borrar;
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&$('overlay').classList.contains('on')&&e.target.tagName!=='SELECT')guardar();});
$('btnBuscar').onclick=()=>{const sb=$('searchbar');sb.classList.toggle('on');if(sb.classList.contains('on'))$('q').focus();else{$('q').value='';QUERY='';render();}};
$('q').oninput=()=>{QUERY=$('q').value.trim();renderTable();};

render();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js?v=3',{scope:'./'}).catch(function(){});});}</script>
